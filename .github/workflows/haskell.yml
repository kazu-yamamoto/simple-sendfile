name: Haskell CI

on:
  push:
    branches: [ 'main', 'ci' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  repro:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:  [ 'windows-latest' ]
        ghc: [ '9.4', '9.8', '9.12' ]

    steps:
    - run: git config --global core.autocrlf false

    - uses: actions/checkout@v7

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: 'latest'

    - name: Build repro
      working-directory: repro
      run: |
        cabal update
        cabal build all
        cabal list-bin repro-nt

    - name: Run repro (non-threaded)
      working-directory: repro
      run: cabal run -v0 repro-nt -- nt 300

    - name: Run repro (threaded)
      working-directory: repro
      run: cabal run -v0 repro-t -- threaded 300
